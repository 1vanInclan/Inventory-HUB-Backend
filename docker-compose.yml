services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules # ✅ Este déjalo para no borrar tus librerías
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./      # ✅ Docker vigila esto desde afuera
          target: /app  # ✅ Y lo inyecta aquí adentro
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json